<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1320" viewBox="0 0 2000 1320">
  <rect width="2000" height="1320" fill="#ffffff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" fill="#20262d">
    <text x="80" y="72" font-size="48" font-weight="500">pxpipe vs pxpipe-go</text>
    <text x="80" y="116" font-size="27" fill="#5f6b78">Median time/op &#183; lower is better</text>

    <text x="80" y="176" font-size="22" fill="#5f6b78">Implementation</text>
    <text x="338" y="176" font-size="22" fill="#5f6b78">Time/op (ms)</text>
    <text x="1628" y="176" font-size="22" fill="#5f6b78">Speedup</text>

    <g stroke="#c6d1df" stroke-width="2">
      <line x1="338" y1="194" x2="338" y2="839"/>
      <line x1="480" y1="194" x2="480" y2="839"/>
      <line x1="622" y1="194" x2="622" y2="839"/>
      <line x1="764" y1="194" x2="764" y2="839"/>
      <line x1="906" y1="194" x2="906" y2="839"/>
      <line x1="1048" y1="194" x2="1048" y2="839"/>
      <line x1="1190" y1="194" x2="1190" y2="839"/>
      <line x1="1332" y1="194" x2="1332" y2="839"/>
      <line x1="80" y1="352" x2="1830" y2="352"/>
      <line x1="80" y1="518" x2="1830" y2="518"/>
      <line x1="80" y1="684" x2="1830" y2="684"/>
    </g>

    <text x="80" y="222" font-size="30">Claude transform</text>
    <text x="80" y="271" font-size="26">pxpipe</text>
    <rect x="338" y="245" width="230.89" height="32" rx="7" fill="#98a3ad"/>
    <text x="585" y="271" font-size="24">162.60 ms</text>
    <text x="80" y="324" font-size="26">pxpipe-go</text>
    <rect x="338" y="297" width="22.89" height="32" rx="7" fill="#218c45"/>
    <text x="377" y="323" font-size="24">16.12 ms</text>
    <text x="1628" y="323" font-size="24">10.1x faster</text>

    <text x="80" y="388" font-size="30">Dense render</text>
    <text x="80" y="437" font-size="26">pxpipe</text>
    <rect x="338" y="411" width="554.37" height="32" rx="7" fill="#98a3ad"/>
    <text x="909" y="437" font-size="24">390.40 ms</text>
    <text x="80" y="490" font-size="26">pxpipe-go</text>
    <rect x="338" y="463" width="12.30" height="32" rx="7" fill="#218c45"/>
    <text x="366" y="489" font-size="24">8.66 ms</text>
    <text x="1628" y="489" font-size="24">45.1x faster</text>

    <text x="80" y="554" font-size="30">OpenAI Chat</text>
    <text x="80" y="603" font-size="26">pxpipe</text>
    <rect x="338" y="577" width="170.54" height="32" rx="7" fill="#98a3ad"/>
    <text x="525" y="603" font-size="24">120.10 ms</text>
    <text x="80" y="656" font-size="26">pxpipe-go</text>
    <rect x="338" y="629" width="10.05" height="32" rx="7" fill="#218c45"/>
    <text x="364" y="655" font-size="24">7.08 ms</text>
    <text x="1628" y="655" font-size="24">17.0x faster</text>

    <text x="80" y="720" font-size="30">OpenAI Responses</text>
    <text x="80" y="769" font-size="26">pxpipe</text>
    <rect x="338" y="743" width="923.57" height="32" rx="7" fill="#98a3ad"/>
    <text x="1278" y="769" font-size="24">650.40 ms</text>
    <text x="80" y="822" font-size="26">pxpipe-go</text>
    <rect x="338" y="795" width="22.42" height="32" rx="7" fill="#218c45"/>
    <text x="377" y="821" font-size="24">15.79 ms</text>
    <text x="1628" y="821" font-size="24">41.2x faster</text>

    <g font-size="20" fill="#5f6b78" text-anchor="middle">
      <text x="338" y="887">0</text>
      <text x="480" y="887">100</text>
      <text x="622" y="887">200</text>
      <text x="764" y="887">300</text>
      <text x="906" y="887">400</text>
      <text x="1048" y="887">500</text>
      <text x="1190" y="887">600</text>
      <text x="1332" y="887">700 ms</text>
    </g>

    <line x1="80" y1="922" x2="1830" y2="922" stroke="#c6d1df" stroke-width="2"/>
    <text x="80" y="970" font-size="30">Peak RSS, full benchmark suite</text>
    <text x="80" y="1014" font-size="27" fill="#5f6b78">Median maximum resident set size (MiB) &#183; lower is better</text>
    <text x="80" y="1062" font-size="22" fill="#5f6b78">Implementation</text>
    <text x="338" y="1062" font-size="22" fill="#5f6b78">Peak RSS (MiB)</text>
    <text x="1628" y="1062" font-size="22" fill="#5f6b78">Reduction</text>

    <g stroke="#c6d1df" stroke-width="2">
      <line x1="338" y1="1078" x2="338" y2="1200"/>
      <line x1="648" y1="1078" x2="648" y2="1200"/>
      <line x1="959" y1="1078" x2="959" y2="1200"/>
      <line x1="1269" y1="1078" x2="1269" y2="1200"/>
    </g>
    <text x="80" y="1127" font-size="26">pxpipe</text>
    <rect x="338" y="1094" width="1000.40" height="32" rx="7" fill="#98a3ad"/>
    <text x="1355" y="1120" font-size="24">322.19 MiB</text>
    <text x="80" y="1180" font-size="26">pxpipe-go</text>
    <rect x="338" y="1147" width="347.42" height="32" rx="7" fill="#218c45"/>
    <text x="702" y="1173" font-size="24">111.89 MiB</text>
    <text x="1628" y="1173" font-size="24">65.3% lower</text>

    <g font-size="20" fill="#5f6b78" text-anchor="middle">
      <text x="338" y="1232">0</text>
      <text x="648" y="1232">100</text>
      <text x="959" y="1232">200</text>
      <text x="1269" y="1232">300 MiB</text>
    </g>

    <text x="80" y="1291" font-size="19" fill="#5f6b78">pxpipe@a9b9759 &#183; pxpipe-go@27ef82c+worktree &#183; Apple M1 Pro &#183; macOS 26.5.2 &#183; Node 26.5.0 &#183; Go 1.26.5 &#183; median of five runs</text>
  </g>
</svg>
